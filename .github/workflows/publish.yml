name: Publish to PyPI

on:
  push:
    tags:
      - "*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

env:
  # On Linux targets that are cross-compiled, `--find-interpreter` builds for the
  # Python versions listed inside maturin, so the maturin version decides the set
  # of wheels. 1.15.0 lists no Python 3.15 there; 1.16.0 does.
  MATURIN_VERSION: "1.16.0"

jobs:
  # Runs first so that a wrong tag fails in seconds, before the wheels are built.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only a tag publishes to PyPI. A branch run is a dry run, so there is no
      # version to check. Only this step is skipped, because skipping the job
      # would also skip every job that needs it.
      - name: Check that the tag matches the version in pyproject.toml
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          # A tag must match the version in its own commit. Otherwise a mistyped
          # tag, or a tag on a commit whose version was not updated, would upload
          # wheels under the wrong release. Commits from before this check have no
          # such check.
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match version '$version' in pyproject.toml"
            exit 1
          fi

  linux:
    needs: [check-version]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
          - runner: ubuntu-latest
            target: s390x
          - runner: ubuntu-latest
            target: ppc64le
    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize Ruff submodule
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    needs: [check-version]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize Ruff submodule
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    needs: [check-version]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize Ruff submodule
          submodules: recursive
      # Explicitly install all supported versions of Python on Windows.
      # What happened in the past was that when we installed only Python 3.14,
      # then the Windows runner would NOT generate wheels for Python 3.8.
      # See https://github.com/django-components/djc-core/issues/22
      # And https://pypi.org/project/djc-core-html-parser/1.0.3/#files
      - name: Setup Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          architecture: ${{ matrix.platform.target }}
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: ${{ matrix.platform.target }}
      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.target }}
      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.target }}
      - name: Setup Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: ${{ matrix.platform.target }}
      - name: Setup Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    needs: [check-version]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize Ruff submodule
          submodules: recursive
      # Explicitly install all supported versions of Python on macOS.
      # Otherwise, as of Jan 2026, if we installed only Python 3.14,
      # then the macOS runner would NOT generate wheels for Python 3.10.
      # See https://github.com/django-components/djc-core/issues/22
      # And https://pypi.org/project/djc-core/1.1.0/#files
      - name: Setup Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Setup Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Setup Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Initialize Ruff submodule
          submodules: recursive
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "wheels-*/*"
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
